    <script>
      (function() {
        'use strict';

        // Clock
        const clockEl = document.getElementById('clock');
        const dateEl  = document.getElementById('date');

        const DAYS   = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
        const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

        // Performance Optimization: Update clock only when minute changes instead of polling every 1000ms.
        // Also skip updates if tab is in background, re-syncing on visibilitychange.
        let timerId = null;
        let lastTimeStr = '';
        let lastDateStr = '';

        function updateClock() {
          const now = new Date();
          const h = String(now.getHours()).padStart(2, '0');
          const m = String(now.getMinutes()).padStart(2, '0');
          const timeStr = h + ':' + m;
          const dateStr = DAYS[now.getDay()] + ', ' + MONTHS[now.getMonth()] + ' ' + now.getDate() + ', ' + now.getFullYear();

          if (timeStr !== lastTimeStr) {
            clockEl.textContent = timeStr;
            clockEl.setAttribute('datetime', now.toISOString());
            lastTimeStr = timeStr;
          }

          if (dateStr !== lastDateStr) {
            dateEl.textContent = dateStr;
            lastDateStr = dateStr;
          }

          // Schedule next update precisely at the beginning of the next minute
          if (timerId) clearTimeout(timerId);
          if (!document.hidden) {
            const delay = (60 - now.getSeconds()) * 1000 - now.getMilliseconds();
            timerId = setTimeout(updateClock, delay);
          }
        }

        updateClock();

        document.addEventListener('visibilitychange', function() {
          if (!document.hidden) {
            updateClock();
          }
        });

        // DOM Elements
        const searchForm             = document.getElementById('search-form');
        const searchInput            = document.getElementById('search');
        const engineSelect           = document.getElementById('engine-select');
        const clearBtn               = document.getElementById('clear-btn');
        const currentEngineIndicator = document.getElementById('current-engine');

        // Search engine configurations
        const searchEngines = {
          google:     { url: 'https://www.google.com/search',        name: 'Google',     param: 'q' },
          bing:       { url: 'https://www.bing.com/search',           name: 'Bing',       param: 'q' },
          duckduckgo: { url: 'https://duckduckgo.com/',               name: 'DuckDuckGo', param: 'q' },
          brave:      { url: 'https://search.brave.com/search',       name: 'Brave',      param: 'q' },
          yahoo:      { url: 'https://search.yahoo.com/search',       name: 'Yahoo',      param: 'p' },
          ecosia:     { url: 'https://www.ecosia.org/search',         name: 'Ecosia',     param: 'q' },
          you:        { url: 'https://you.com/search',                name: 'You.com',    param: 'q' },
          yep:        { url: 'https://yep.com/web',                   name: 'Yep',        param: 'q' },
          webvium:    { url: 'https://mrepol742.github.io/search',    name: 'Webvium',    param: 'q' }
        };

        const STORAGE_KEY = 'webvium-search-engine';

        function loadPreference() {
          try {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved && searchEngines[saved]) {
              engineSelect.value = saved;
              updateEngineIndicator(saved);
            }
          } catch (e) {
            // localStorage not available, ignore
          }
        }

        function savePreference(engine) {
          try {
            localStorage.setItem(STORAGE_KEY, engine);
          } catch (e) {
            // localStorage not available, ignore
          }
        }

        function updateEngineIndicator(engine) {
          const engineData = searchEngines[engine] || searchEngines.google;
          currentEngineIndicator.textContent = 'Using ' + engineData.name;
        }

        // Handle form submission
        searchForm.addEventListener('submit', function() {
          const selectedEngine = engineSelect.value;
          const engineData     = searchEngines[selectedEngine] || searchEngines.google;
          this.action          = engineData.url;
          searchInput.name     = engineData.param !== 'q' ? engineData.param : 'q';
          savePreference(selectedEngine);
        });

        // Handle search engine change
        engineSelect.addEventListener('change', function() {
          updateEngineIndicator(this.value);
          savePreference(this.value);
          searchInput.focus();
        });

        // Handle clear button visibility
        searchInput.addEventListener('input', function() {
          clearBtn.hidden = this.value.length === 0;
        });

        // Handle clear button click
        clearBtn.addEventListener('click', function() {
          searchInput.value = '';
          clearBtn.hidden   = true;
          searchInput.focus();
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', function(event) {
          if (event.key === '/' && document.activeElement !== searchInput && document.activeElement !== engineSelect) {
            event.preventDefault();
            searchInput.focus();
            searchInput.select();
          }
          if (event.key === 'Escape' && document.activeElement === searchInput) {
            if (searchInput.value) {
              searchInput.value = '';
              clearBtn.hidden   = true;
            } else {
              searchInput.blur();
            }
          }
        });

        // Auto-focus search input on page load
        window.addEventListener('DOMContentLoaded', function() {
          loadPreference();
          if (window.innerWidth > 768) {
            searchInput.focus();
          }
        });

      })();
